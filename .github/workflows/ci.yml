name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: Engine tests, century sims and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/engine.test.js
      - name: Balance check (offline earnings capped by nights, the free century, era 3 still buying, prestige faster)
        run: |
          node sim/sim.js check 7
          node sim/sim.js check 1000
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.js
